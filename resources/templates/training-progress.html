{% extends "base.html" %}

{% block content %}

<h3 class="uppercase text-lg my-8">Model Training</h3>

<div class="card card-border max-w-2xl">
  <div class="card-body">
    <p id="training-label" class="font-semibold">Loading…</p>
    <progress id="training-bar" class="progress progress-primary w-full" value="0" max="100"></progress>
    <p id="training-percent" class="text-sm"></p>
    <p id="training-detail" class="text-sm opacity-70"></p>
    <ul id="training-steps" class="mt-4 space-y-1 text-sm" aria-label="Training steps"></ul>
    <div id="training-result" class="alert mt-4" role="alert" hidden>
      <span id="training-result-text"></span>
    </div>
    <div class="card-actions mt-4">
      <a id="training-back" class="btn btn-outline" href="{{back}}">Back</a>
    </div>
    <p class="text-xs opacity-60 mt-2">Training continues in the background even if you leave this page; the result is shown as a message on your next page load.</p>
  </div>
</div>

<script>
  (function () {
    var bar = document.getElementById('training-bar');
    var label = document.getElementById('training-label');
    var percent = document.getElementById('training-percent');
    var detail = document.getElementById('training-detail');
    var result = document.getElementById('training-result');
    var resultText = document.getElementById('training-result-text');
    var stepsList = document.getElementById('training-steps');

    var stepIcons = {done: '✓', running: '▶', pending: '○', failed: '✕', skipped: '–'};
    var stepClasses = {done: 'text-success', running: 'text-primary font-semibold', pending: 'opacity-60', failed: 'text-error font-semibold', skipped: 'opacity-70'};

    function renderStep(step, nested) {
      var item = document.createElement('li');
      item.className = (nested ? 'ml-6 ' : '') + (stepClasses[step.state] || '');
      var icon = document.createElement('span');
      icon.className = 'inline-block w-5';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = stepIcons[step.state] || '○';
      var text = document.createElement('span');
      text.textContent = step.label + (step.detail ? ' - ' + step.detail : '');
      var stateText = document.createElement('span');
      stateText.className = 'sr-only';
      stateText.textContent = ' (' + step.state + ')';
      item.appendChild(icon);
      item.appendChild(text);
      item.appendChild(stateText);
      var fragment = document.createDocumentFragment();
      fragment.appendChild(item);
      (step.children || []).forEach(function (child) { fragment.appendChild(renderStep(child, true)); });
      return fragment;
    }

    function renderSteps(steps) {
      stepsList.textContent = '';
      (steps || []).forEach(function (step) { stepsList.appendChild(renderStep(step, false)); });
    }

    function describe(state) {
      if (state.status === 'idle') { return 'No training run has been started.'; }
      if (state.phase === 'starting') { return 'Preparing the training run…'; }
      if (state.phase === 'collecting') {
        var computed = state['tokens-computed'] || 0;
        return 'Collecting training data: ' + (state['emails-written'] || 0) + ' of ' + (state['emails-total'] || 0) + ' categorized e-mails'
          + (computed ? ' (' + computed + ' analysed for the first time and cached)' : '');
      }
      if (state.phase === 'training') {
        var progress = state['language-progress'] || {};
        var parts = Object.keys(progress).sort().map(function (language) {
          var p = progress[language];
          if (p['failed?']) { return language + ': failed'; }
          if (p['done?']) { return language + ': done'; }
          if (p.iteration) { return language + ': iteration ' + p.iteration + ' of at most ' + p.iterations; }
          return language + ': running';
        });
        return 'Training ' + (state.languages || parts.length) + ' language model(s) in parallel' + (parts.length ? ' - ' + parts.join(', ') : '');
      }
      if (state.phase === 'writing') { return 'Writing the model files…'; }
      return '';
    }

    function render(state) {
      var running = state.status === 'running';
      bar.value = state.percent || 0;
      label.textContent = (state.label || 'Training') + (running ? ' in progress' : (state.status === 'finished' ? ' finished' : ''));
      percent.textContent = (state.percent || 0) + ' %';
      detail.textContent = running ? describe(state) : '';
      renderSteps(state.steps);
      if (state.status === 'finished' && state.result) {
        result.hidden = false;
        result.className = 'alert mt-4 ' + (state.result.type === 'success' ? 'alert-success' : (state.result.type === 'alert' ? 'alert-error' : 'alert-info'));
        resultText.textContent = state.result.content || '';
      } else {
        result.hidden = true;
      }
      return running;
    }

    function poll() {
      fetch('/training/status', {cache: 'no-store'})
        .then(function (response) { return response.json(); })
        .then(function (state) { if (render(state)) { setTimeout(poll, 1000); } })
        .catch(function () { detail.textContent = 'Could not read the training status. Retrying…'; setTimeout(poll, 3000); });
    }

    poll();
  })();
</script>

{% endblock %}
